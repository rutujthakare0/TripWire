services:

  sample-app:
    build: ./tripwire/sample-app

    ports:
      - "5000:5000"

    environment:
      APP_VERSION: v1
      CHAOS_MODE: none

  prometheus:
    image: prom/prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./tripwire/infra/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - sample-app
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus