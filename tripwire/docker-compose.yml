services:
  sample-app-v1:
    build: ./sample-app
    image: tripwire/sample-app:stable
    container_name: sample-app-v1
    environment:
      APP_VERSION: v1
      CHAOS_MODE: none
    networks:
      - tripwire

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - sample-app-v1
    networks:
      - tripwire

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - tripwire

  load-generator:
    build: ./load-generator
    depends_on:
      - nginx
    networks:
      - tripwire

  nginx:
    build: ./proxy
    container_name: tripwire-nginx
    ports:
      - "8080:80"
    depends_on:
      - sample-app-v1
    volumes:
      - ./proxy/upstream.conf:/etc/nginx/conf.d/upstream.conf
    networks:
      - tripwire

  controller:
    build: ./controller
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./proxy/upstream.conf:/shared/upstream.conf
    depends_on:
      - nginx
    networks:
      - tripwire

  analysis-engine:
    build: ./analysis-engine
    depends_on:
      - controller
      - prometheus
    networks:
      - tripwire

networks:
  tripwire:
    name: tripwire